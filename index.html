<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全屏背景图片</title>
    <style>
        /* 关键样式：确保根元素占满视口 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* 防止滚动条出现 */
        }
        
        /* 全屏背景容器 */
        .fullscreen-bg {
            background-image: url('20250723161313.jpg'); /* 替换为你的图片URL */
            background-size: cover;      /* 关键：图片按比例缩放覆盖整个区域 */
            background-position: center; /* 图片居中显示 */
            background-repeat: no-repeat; /* 禁止重复 */
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="fullscreen-bg"></div>
</body>
</html>
